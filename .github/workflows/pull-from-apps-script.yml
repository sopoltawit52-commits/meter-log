# Run manually after editing code in the Apps Script editor:
# pulls the current project into apps-script/ and commits any changes.
name: Pull from Apps Script

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Write clasp credentials and project config
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"apps-script"}' "$SCRIPT_ID" > .clasp.json

      - name: Pull code
        run: clasp pull

      - name: Commit changes
        run: |
          rm -f .clasp.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sync from Apps Script editor [skip ci]"
            git push
          fi
