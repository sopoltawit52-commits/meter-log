# Push apps-script/ to Google Apps Script and update the existing web app
# deployment (the /exec URL stays the same).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLASPRC_JSON   contents of ~/.clasprc.json after `npx @google/clasp@2.4.2 login`
#   SCRIPT_ID      Apps Script project ID (Project Settings → Script ID)
#   DEPLOYMENT_ID  web app deployment ID (Deploy → Manage deployments → Deployment ID)
name: Deploy to Apps Script

on:
  push:
    branches: [main]
    paths:
      - "apps-script/**"
  workflow_dispatch:

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Write clasp credentials and project config
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"apps-script"}' "$SCRIPT_ID" > .clasp.json

      - name: Push code
        run: clasp push --force

      - name: Update web app deployment
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"
